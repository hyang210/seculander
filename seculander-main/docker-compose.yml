services:
  api:
    build: .
    ports: ["3000:3000"]
    env_file: [.env]
    environment:
      - MOCK_DB=false
      - MONGO_URI=mongodb://mongo:27017/focusflowdb   
      - PORT=3000
      - DATA_DIR=/app/data/training
      - MODEL_DIR=/app/data/models
      - GPUJS_DISABLE=1
      - BRAINJS_FORCE_CPU=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FOCUS_CACHE_TTL=3600
    depends_on:
      - mongo
      - redis
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - ./data/mongo:/data/db
  mongo-express:
    image: mongo-express:1
    ports: ["8081:8081"]
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017
      - ME_CONFIG_BASICAUTH=false
    depends_on: [mongo]

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
