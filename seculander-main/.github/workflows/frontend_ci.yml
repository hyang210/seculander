name: Frontend CI # 프론트엔드 코드 품질

on:
  push:
    branches: [ Develop, Main ]
    paths:
      - 'frontend_app/**'
  pull_request:
    branches: [ Develop ]
    paths:
      - 'frontend_app/**'

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend_app

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend_app/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint
      continue-on-error: true

    - name: Run Tests
      run: npm test -- --passWithNoTests