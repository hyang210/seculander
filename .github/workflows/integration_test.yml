name: Integration Test (DB & Redis) # DB 연동 통합 테스트

on:
  push:
    branches: [ Develop, Main ]
    paths:
      - 'src/**'

jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    # GitHub Actions 서비스 컨테이너 활용
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci

    - name: Run Integration Tests
      # 환경 변수를 주입하여 서비스 컨테이너에 접속
      env:
        MONGO_URI: mongodb://localhost:27017/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      # 테스트 파일이 있다면 npm test가 실행되며 DB 접속을 시도함
      run: npm test -- --passWithNoTests