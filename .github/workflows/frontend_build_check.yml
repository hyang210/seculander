name: Frontend Build Check  # 프론트엔드 빌드 검증

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  build-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend_app

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci

    - name: TypeScript Compile Check
      # package.json에 추가한 "build": "tsc --noEmit" 실행
      run: npm run build